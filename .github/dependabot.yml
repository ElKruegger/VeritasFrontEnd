# Weekly pull requests that keep npm packages and GitHub Actions up to
# date; each one goes through CI before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for Next.js and React together: they are released in step.
      next-react:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
          ]
      test-tooling:
        patterns:
          ["vitest", "@vitest/*", "@vitejs/*", "jsdom", "@testing-library/*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
